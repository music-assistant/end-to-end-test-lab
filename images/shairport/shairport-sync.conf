// Lab AirPlay role: everything goes into the role's FIFO as 48 kHz 16-bit stereo, the format
// every capture uses. The name comes from the command line (-a lab-<role>).
general =
{
	output_backend = "pipe";
};

pipe =
{
	name = "/fifo/pcm";
	output_rate = 48000;
	output_format = "S16_LE";
	output_channels = 2;
};
