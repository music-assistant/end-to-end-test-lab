// Lab AirPlay role: everything goes into the role's FIFO as 48 kHz 16-bit stereo, the format
// every capture uses. The name comes from the command line (-a lab-<role>).
general =
{
	output_backend = "pipe";
	// The pipe backend cannot take back what it has written. With its own default of one second
	// a flushed track stays in the capture for that second; this is the lead of a real output.
	audio_backend_buffer_desired_length_in_seconds = 0.15;
};

pipe =
{
	name = "/fifo/pcm";
	output_rate = 48000;
	output_format = "S16_LE";
	output_channels = 2;
};
