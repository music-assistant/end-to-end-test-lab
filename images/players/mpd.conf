# Lab MPD role: no library, MA hands it stream URLs. The pipe output writes as fast as the
# FIFO drains; the role's pacer reads it at 48 kHz 16-bit stereo, which paces MPD.
bind_to_address "0.0.0.0"
port "6600"
audio_output {
    type    "pipe"
    name    "lab"
    # one-page pipes: cat (128 KiB) and dd (two 64 KiB pipes) kept playing up to 1 s after stop
    command "exec lab-pipecopy /fifo/pcm"
    format  "48000:16:2"
    # so MA's volume commands work; bootstrap sets 100, which is unity gain
    mixer_type "software"
}
