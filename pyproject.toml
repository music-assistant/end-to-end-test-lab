[project]
name = "ma-lab"
version = "0.1.0"
description = "Music Assistant end-to-end test lab: broker, CLI, virtual players, audio oracle"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1",
    "numpy>=2.0",
    "scipy>=1.13",
    "pyyaml>=6.0",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
players = ["aiosendspin>=10.2"]
test = ["pytest>=8.0", "pytest-asyncio>=0.24", "pytest-timeout>=2.3"]
scenarios = ["music-assistant-client"]

[project.scripts]
labctl = "labctl.cli:main"
labd = "labctl.broker:main"
lab-pacer = "labctl.pacer:main"
lab-pipecopy = "labctl.pipecopy:main"
lab-sendspin = "labctl.sendspin_client:main"
lab-radio = "labctl.radio:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["labctl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
timeout = 900
# "thread" kills the process: no junit.xml and no `finally` teardown in the test
timeout_method = "signal"
addopts = "--strict-markers"
markers = [
    "tier1: deterministic scenario on virtual players, may gate a PR",
    "tier2: scenario against real streaming accounts, informational only",
    "hw: scenario that needs leased real hardware",
    "gate: per-area journey a PR gate runs",
    "deep: one check per test, daily deep run",
    "area_core: gate area core",
    "area_queue: gate area queue",
    "area_streams: gate area streams",
    "area_players: gate area players",
    "area_library: gate area library",
    "provider_sendspin: gate journey of the sendspin player provider",
    "provider_airplay: gate journey of the airplay player provider",
    "provider_dlna: gate journey of the dlna player provider",
    "provider_squeezelite: gate journey of the squeezelite player provider",
    "provider_snapcast: gate journey of the snapcast player provider",
    "provider_mpd: gate journey of the mpd player provider",
    "area_music_spotify: tier 2 area spotify",
    "area_music_apple_music: tier 2 area apple_music",
    "area_music_tidal: tier 2 area tidal",
    "area_music_ytmusic: tier 2 area ytmusic",
    "area_music_qobuz: tier 2 area qobuz",
    "area_music_deezer: tier 2 area deezer",
    "roles(*roles): player roles the test runs on",
    "devices(*providers): device families (registry provider keys) the test runs on",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
ignore = ["D203", "D213", "ANN401"]

[tool.mypy]
strict = true
